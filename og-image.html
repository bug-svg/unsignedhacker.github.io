<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a3a2a 0%, #2d5a45 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, sans-serif;
            color: white;
        }
        .logo {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo i {
            font-size: 70px;
            color: #1a3a2a;
        }
        h1 {
            font-size: 80px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }
        p {
            font-size: 32px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="logo">
        <i class="fas fa-bug"></i>
    </div>
    <h1>Duncan</h1>
    <p>Bug Bounty Expert & Software Developer</p>
</body>
</html>
